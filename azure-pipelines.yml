trigger:
  branches:
    include: [main, develop]
pr:
  branches:
    include: [main]
pool:
  vmImage: windows-latest
variables:
  buildConfiguration: Release
  artifactFeed: 'Gift of the Givers Foundation Disaster Relief Web Application/GiftOfTheGiversFeed' 
steps:
- task: UseDotNet@2
  displayName: Install .NET 9 SDK
  inputs:
    packageType: sdk
    version: 9.x
- task: NuGetAuthenticate@1
  displayName: Authenticate to Azure Artifacts
- task: DotNetCoreCLI@2
  displayName: Restore solution dependencies
  inputs:
    command: restore
    projects: Giftofthe_Givers.sln
    feedsToUse: config
    nugetConfigPath: nuget.config
- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: build
    projects: Giftofthe_Givers.sln
    arguments: --configuration $(buildConfiguration) --no-restore
- task: DotNetCoreCLI@2
  displayName: Run unit tests
  inputs:
    command: test
    projects: GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj
    arguments: --configuration $(buildConfiguration) --no-build --no-restore --logger trx
    publishTestResults: true
- task: DotNetCoreCLI@2
  displayName: Pack shared helper library
  inputs:
    command: pack
    packagesToPack: GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj
    packDirectory: $(Build.ArtifactStagingDirectory)/packages
    arguments: --configuration $(buildConfiguration) --no-build
- task: PublishBuildArtifacts@1
  displayName: Publish NuGet package as a pipeline artifact
  inputs:
    PathtoPublish: $(Build.ArtifactStagingDirectory)/packages
    ArtifactName: helper-nuget-package
    publishLocation: Container
- task: NuGetCommand@2
  displayName: Publish helper package to Azure Artifacts feed
  condition: and(succeeded(), ne(variables['artifactFeed'], ''))
  inputs:
    command: push
    packagesToPush: $(Build.ArtifactStagingDirectory)/packages/*.nupkg
    nuGetFeedType: internal
    publishVstsFeed: $(artifactFeed)
    allowPackageConflicts: true
